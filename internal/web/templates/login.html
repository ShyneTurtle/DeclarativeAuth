{{define "content"}}
{{if .Error}}<p class="error">{{icon "warning"}}{{.Error}}</p>{{end}}

<button type="button" id="passkey-login" hidden>{{icon "key"}}Log in with a passkey</button>
<p id="passkey-status" role="status"></p>
<div class="divider" id="passkey-divider" hidden>or</div>

<form method="post" action="/login">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="return_to" value="{{.ReturnTo}}">
  <label>Username or email
    <input type="text" name="username" autocomplete="username" required autofocus value="{{.Username}}">
  </label>
  <label>Password
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <p class="muted"><a href="/reset?return_to={{.ReturnTo}}">Forgot your password?</a></p>
  <button type="submit" class="secondary">Log in</button>
</form>

<script src="/static/webauthn.js"></script>
<script>
  DeclarativeAuthPasskeys.initLoginButton(
    document.getElementById('passkey-login'),
    document.getElementById('passkey-status'),
    {{.ReturnTo}}
  );
  if (!document.getElementById('passkey-login').hidden) {
    document.getElementById('passkey-divider').hidden = false;
  }
</script>
{{end}}
