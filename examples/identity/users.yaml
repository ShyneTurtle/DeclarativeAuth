# Declarative users. This file declares WHO exists and WHICH groups they
# directly belong to -- see groups.yaml for how group membership then
# recursively expands (e.g. jsmith below ends up in backend-team, oncall,
# AND engineering, despite only "oncall" and "backend-team" being listed
# here directly).
#
# By default, no password lives in this file -- credentials are stored (as
# Argon2id hashes) in Postgres, set separately via:
#   declarativeauth admin set-password -username <user> -password <pw> ...
# or by an admin sending a self-service setup link from the admin UI. The
# deliberate exception is passwordHash/passwordHashFile below, for accounts
# that are themselves config-managed (LDAP service/bind accounts, CI users)
# rather than a person who'd want self-service password changes -- see
# svc-example at the bottom of this file.
#
# This file is hot-reloaded, same as groups.yaml -- no restart needed after
# an edit. Run `declarativeauth validate-config` to catch mistakes (e.g. a
# `memberOfGroups` entry that doesn't match any declared group) before
# deploying.
#
# Field reference:
#   username        (required) unique login name, used for LDAP bind (uid=...) and OIDC.
#   email           (required for password-reset/setup emails and admin-UI email lookup)
#   firstName, name  optional "given name" / "surname" -- combined into the LDAP cn /
#                     OIDC "name" claim as "firstName name" when displayName isn't set.
#   displayName      optional explicit override for the combined firstName+name (see jsmith vs admin below).
#   enabled          (required) false = account still exists (kept for audit/history) but cannot log in.
#   memberOfGroups   direct group memberships; must reference names declared in groups.yaml.
#   mfaEnabled       optional, default false -- forces email-based MFA on for this specific user,
#                     regardless of group membership. (A group's `requireMFA: true` in groups.yaml
#                     does the same for every member, direct or transitive. Either source is enough;
#                     a user can also self-enable MFA from their profile page independently of both.)
#   passwordHash      optional Argon2id hash (generate with `declarativeauth admin hash-password`),
#                     declared directly instead of set via the CLI/self-service reset. Makes the
#                     account entirely config-managed: Postgres is bypassed at login, and both the
#                     self-service reset flow and `admin set-password` refuse to touch it. Mutually
#                     exclusive with passwordHashFile. Since it's committed as-is, prefer
#                     passwordHashFile when this file lives in version control.
#   passwordHashFile  same as passwordHash, but read from a file -- typically a mounted Docker or
#                     Kubernetes secret -- instead of inlined here. This is what replaces an
#                     init-container-that-runs-admin-set-password: mount the secret, point this at
#                     it, done. Hot-reloads like everything else here; a relative path resolves
#                     against this identity directory. Mutually exclusive with passwordHash.

apiVersion: declarativeauth.io/v1
kind: UserList
users:
  - username: jsmith
    email: jsmith@example.com
    firstName: "Jane"
    name: "Smith"          # No displayName set -> LDAP cn / OIDC name become "Jane Smith" automatically.
    enabled: true
    memberOfGroups:
      - backend-team
      - oncall              # Directly in "oncall" AND "backend-team" is redundant but harmless --
                             # oncall already implies backend-team via the diamond in groups.yaml.

  - username: admin
    email: admin@example.com
    displayName: "System Admin"   # Explicit override -- shown as-is instead of deriving from firstName/name.
    enabled: true
    memberOfGroups:
      - admins                     # Member of "admins" -> can reach the admin UI (DECLARATIVEAUTH_ADMIN_UI_ADMIN_GROUP).

  - username: contractor1
    email: contractor1@example.com
    displayName: "Temp Contractor"
    enabled: false          # Disabled: the account and its group memberships stay declared, but login is refused.
    memberOfGroups:
      - platform-team

  - username: svc-example
    displayName: "Example LDAP service account"
    enabled: true
    memberOfGroups: []
    # Password is "Secret123!", entirely config-managed -- no
    # `admin set-password` bootstrap step, no self-service reset. See
    # deploy/kubernetes/secret-ldap-passwords.yaml for the
    # passwordHashFile flavor of the same thing.
    passwordHash: "$argon2id$v=19$m=19456,t=2,p=1$9XREVr0dmc+INRR5msVGxw$BH4aum3hpF3jydAuCSr0PioxTWmte0VdfDsxUIF5iM8"
