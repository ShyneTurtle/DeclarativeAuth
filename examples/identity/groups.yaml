# Declarative groups. Each group can itself be a member of parent groups
# via `memberOfGroups`, and membership is recursive: a user in "oncall"
# below is transitively also a member of "backend-team", "platform-team",
# AND "engineering" -- DeclarativeAuth resolves ("flattens") this chain for
# you, so LDAP/OIDC clients never have to walk the group graph themselves.
#
# This file is hot-reloaded: edit it and the change applies within
# DECLARATIVEAUTH_IDENTITY_RELOAD_DEBOUNCE (see .env.example), no restart needed.
# Run `declarativeauth validate-config` to check this file (and users.yaml)
# for mistakes -- like a typo'd group name, or a cycle -- before deploying.
#
# The example below forms a diamond, to demonstrate that inheriting the
# same ancestor group through two different paths is fine and only counts
# once:
#
#             engineering
#              /        \
#     backend-team   platform-team
#              \        /
#               oncall
#
# A user who is only declared as a member of "oncall" (see users.yaml)
# ends up flattened to: [oncall, backend-team, platform-team, engineering]
#
# Three more optional fields put arbitrary out-of-schema LDAP attributes on
# an entry (see users.yaml's customAttribute for the value-shape rules):
#   customAttribute            sets attributes on this GROUP's own entry.
#   userCustomAttribute        pushes attributes onto every FLATTENED (transitive) member's
#                               own entry instead -- see engineering/department below.
#   directUserCustomAttribute  same, but only for DIRECT members -- see backend-team/badge below.
# If the same attribute key ends up declared by more than one source for the
# same user (two groups both pushing "department", say), a warning is thrown and the attribute
# is dropped for that user to avoid ambiguity.

apiVersion: declarativeauth.io/v1
kind: GroupList
groups:
  - name: engineering
    description: "All engineering staff"
    memberOfGroups: []   # Top of the hierarchy: not a member of any other group.
    userCustomAttribute:
      department: "Engineering"   # Pushed onto every FLATTENED (transitive) member's own LDAP
                                  # entry: jsmith gets this via backend-team/oncall below,
                                  # without declaring it on jsmith directly.
    customAttribute:
      costCenter: "4200"    # Unlike userCustomAttribute above, this sets an attribute on
                            # engineering's OWN entry (cn=engineering,...), not on any member's.

  - name: backend-team
    description: "Backend engineers"
    memberOfGroups:
      - engineering       # Every backend-team member is transitively in engineering too.
    directUserCustomAttribute:
      badge: "backend-direct"  # Pushed only onto DIRECT members of backend-team (jsmith, in
                                # users.yaml). An oncall member (also transitively in
                                # backend-team) would NOT get this.

  - name: platform-team
    description: "Platform/infra engineers"
    memberOfGroups:
      - engineering

  - name: oncall
    description: "On-call rotation, cross-functional"
    memberOfGroups:
      - backend-team       # oncall inherits from BOTH parents -- the diamond above --
      - platform-team       # and still only appears once in a member's flattened group list.

  - name: admins
    description: "DeclarativeAuth administrators -- gates access to the admin UI (see DECLARATIVEAUTH_ADMIN_UI_ADMIN_GROUP in .env.example)"
    memberOfGroups: []
    requireMFA: true   # Every admin (direct or transitive member) must complete email-based MFA at login.
