name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: build
        run: go build ./...

      - name: unit tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: coverage summary
        run: go tool cover -func=coverage.out

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: declarativeauth
          POSTGRES_PASSWORD: declarativeauth
          POSTGRES_DB: declarativeauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: integration tests
        env:
          DATABASE_URL: postgres://declarativeauth:declarativeauth@localhost:5432/declarativeauth?sslmode=disable
        run: go test ./test/integration/... -race -tags=integration
