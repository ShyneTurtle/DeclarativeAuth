apiVersion: v1
kind: Service
metadata:
  name: declarativeauth
spec:
  selector:
    app: declarativeauth
  ports:
    - name: ldaps
      port: 636
      targetPort: ldaps
    - name: https
      port: 8443
      targetPort: https
---
# Metrics kept ClusterIP-only, scraped in-cluster by Prometheus.
apiVersion: v1
kind: Service
metadata:
  name: declarativeauth-metrics
  labels:
    app: declarativeauth
spec:
  selector:
    app: declarativeauth
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
