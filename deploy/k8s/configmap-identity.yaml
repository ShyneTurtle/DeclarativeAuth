# Example ConfigMap holding the declarative users.yaml/groups.yaml, mounted
# as a volume (not env vars, since env vars can't hot-reload). Edit this
# ConfigMap (or better, manage it via GitOps) to change identity/authorization
# — DeclarativeAuth picks up changes via its fsnotify-based watcher once
# kubelet has synced the updated ConfigMap to the pod's mounted volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: declarativeauth-identity
data:
  groups.yaml: |
    apiVersion: declarativeauth.io/v1
    kind: GroupList
    groups:
      - name: engineering
        description: "All engineering staff"
        memberOfGroups: []
      - name: backend-team
        memberOfGroups: [engineering]
      - name: platform-team
        memberOfGroups: [engineering]
      - name: oncall
        memberOfGroups: [backend-team, platform-team]
      - name: admins
        memberOfGroups: []
  users.yaml: |
    apiVersion: declarativeauth.io/v1
    kind: UserList
    users:
      - username: admin
        email: admin@example.com
        displayName: "System Admin"
        enabled: true
        memberOfGroups: [admins]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: declarativeauth-config
data:
  declarativeauth.yaml: |
    logging:
      level: info
      format: json
    database:
      dsn: "postgres://declarativeauth:${DB_PASSWORD}@declarativeauth-db-rw:5432/declarativeauth?sslmode=verify-full"
      maxConns: 10
    passwordPolicy:
      minLength: 12
      minStrength: 3
    ldap:
      listenAddr: "0.0.0.0:636"
      baseDN: "dc=example,dc=com"
      tls:
        enabled: true
    oidc:
      issuer: "https://auth.example.com"
      listenAddr: "0.0.0.0:8443"
      tls:
        enabled: true
    smtp:
      host: smtp.example.com
      port: 587
      username: "notifications@example.com"
      passwordEnv: "SMTP_PASSWORD"
      from: "DeclarativeAuth <notifications@example.com>"
    metrics:
      listenAddr: "0.0.0.0:9090"
    config:
      identityPath: /etc/declarativeauth/identity
      reloadDebounce: 500ms
    network:
      trustedProxies: []
    rateLimit:
      threshold: 5
      backoffBase: 1s
      backoffMax: 15m
      window: 24h
    adminUI:
      enabled: true
      adminGroup: admins
      configEditor:
        enabled: false
    tls:
      certFile: /etc/declarativeauth/tls/tls.crt
      keyFile: /etc/declarativeauth/tls/tls.key
