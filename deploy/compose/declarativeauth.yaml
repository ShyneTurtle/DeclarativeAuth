# Server config used by the root docker-compose.yaml test stack
# (`docker compose up -d --build`, see README "Try it out"). It's the same
# shape as configs/example/declarativeauth.yaml -- see that file for a
# fully-commented field-by-field reference. The two differences from that
# base example, both required for it to work inside docker-compose's
# network, are called out below.
logging:
  level: info
  format: json
database:
  # host is "postgres", the compose service name, not "localhost" -- containers
  # reach each other by service name on the compose-managed network.
  dsn: "postgres://declarativeauth:${DB_PASSWORD}@postgres:5432/declarativeauth?sslmode=disable"
  maxConns: 10
ldap:
  listenAddr: "0.0.0.0:389"
  baseDN: "dc=example,dc=com"
  tls:
    enabled: false   # Plain LDAP for local testing; see README's TLS section for LDAPS.
oidc:
  issuer: "http://localhost:8080"
  listenAddr: "0.0.0.0:8080"
  tls:
    enabled: false   # Plain HTTP for local testing.
  clients:
    - clientID: example-client
      redirectURIs:
        - "http://localhost:9000/callback"
      public: true
smtp:
  # host is "mailcatcher", the compose service name -- catches every
  # outgoing email without actually delivering it. View them at
  # http://localhost:1080 while the stack is running.
  host: mailcatcher
  port: 1025
  from: "DeclarativeAuth <notifications@example.com>"
metrics:
  listenAddr: "0.0.0.0:9090"
config:
  identityPath: /etc/declarativeauth/identity
  reloadDebounce: 500ms
network:
  trustedProxies: []
rateLimit:
  threshold: 5
  backoffBase: 1s
  backoffMax: 15m
  window: 24h
adminUI:
  enabled: true
  adminGroup: admins
  configEditor:
    enabled: true   # Safe here: this stack always runs a single instance.
