apiVersion: apps/v1
kind: Deployment
metadata:
  name: declarativeauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: declarativeauth
  template:
    metadata:
      labels:
        app: declarativeauth
    spec:
      containers:
        - name: declarativeauth
          image: ghcr.io/shyneturtle/declarativeauth:latest
          args: ["serve"]
          ports:
            - name: ldaps
              containerPort: 636
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef: { name: declarativeauth-config }
            - secretRef: { name: declarativeauth-secrets }
          volumeMounts:
            - name: identity
              mountPath: /etc/declarativeauth/identity
              readOnly: true
            - name: tls
              mountPath: /etc/declarativeauth/tls
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 100Mi
              cpu: 250m
      volumes:
        - name: identity
          configMap: { name: declarativeauth-identity }
        - name: tls
          secret: { secretName: declarativeauth-tls }
