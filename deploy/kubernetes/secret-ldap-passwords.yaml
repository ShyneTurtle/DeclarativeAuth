# Placeholder/template only -- do not commit real secrets, same as
# secret-example.yaml. This is what replaces an init-container-that-runs
# `declarativeauth admin set-password`: pre-compute an Argon2id hash
# offline (e.g. in CI, when this Secret itself is built/sealed) with
#
#   declarativeauth admin hash-password -password '<a real password>'
#
# and put the resulting "$argon2id$..." string here, one key per service
# account. Mounted as a *subdirectory* of the identity ConfigMap volume in
# deployment.yaml (/etc/declarativeauth/identity/secrets) so it hot-reloads
# through the exact same fsnotify watcher as users.yaml/groups.yaml --
# rotating this Secret is enough, no restart, no separate imperative step.
# See configmap-identity.yaml's users.yaml for the passwordHashFile
# reference that points at these keys.
apiVersion: v1
kind: Secret
metadata:
  name: declarativeauth-ldap-passwords
type: Opaque
stringData:
  svc-ldap.hash: "changeme -- output of: declarativeauth admin hash-password -password '<a real password>'"
