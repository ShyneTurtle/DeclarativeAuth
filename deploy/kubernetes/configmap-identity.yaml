# Example ConfigMap holding the declarative users.yaml/groups.yaml, mounted
# as a volume (not env vars, since env vars can't hot-reload). Edit this
# ConfigMap (or better, manage it via GitOps) to change identity/authorization
# — DeclarativeAuth picks up changes via its fsnotify-based watcher once
# kubelet has synced the updated ConfigMap to the pod's mounted volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: declarativeauth-identity
data:
  groups.yaml: |
    apiVersion: declarativeauth.io/v1
    kind: GroupList
    groups:
      - name: engineering
        description: "All engineering staff"
        memberOfGroups: []
      - name: backend-team
        memberOfGroups: [engineering]
      - name: platform-team
        memberOfGroups: [engineering]
      - name: oncall
        memberOfGroups: [backend-team, platform-team]
      - name: admins
        memberOfGroups: []
  users.yaml: |
    apiVersion: declarativeauth.io/v1
    kind: UserList
    users:
      - username: admin
        email: admin@example.com
        displayName: "System Admin"
        enabled: true
        memberOfGroups: [admins]
      # A config-managed LDAP bind account -- its password is entirely
      # declarative (see secret-ldap-passwords.yaml), so it needs no
      # `admin set-password` bootstrap step and has no self-service reset.
      - username: svc-ldap
        enabled: true
        memberOfGroups: []
        passwordHashFile: secrets/svc-ldap.hash
  # Optional -- absent/empty means no OIDC clients are registered. See
  # examples/identity/oidc-clients.yaml for a fully-commented example with
  # both a public (SPA) and confidential client.
  oidc-clients.yaml: |
    apiVersion: declarativeauth.io/v1
    kind: OIDCClientList
    clients: []
