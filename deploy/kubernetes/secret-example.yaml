# Placeholder/template only -- do not commit real secrets. Provision the
# real Secret out-of-band (sealed-secrets, external-secrets, or your
# platform's secret manager); DeclarativeAuth just expects these env vars,
# consumed via `envFrom: secretRef` in deployment.yaml.
#
# DECLARATIVEAUTH_DATABASE_DSN is the full connection string, password
# included -- there's no separate password-only field to interpolate it
# from (DeclarativeAuth reads environment variables directly, with no
# templating layer of its own).
apiVersion: v1
kind: Secret
metadata:
  name: declarativeauth-secrets
type: Opaque
stringData:
  DECLARATIVEAUTH_DATABASE_DSN: "postgres://declarativeauth:changeme@declarativeauth-db-rw:5432/declarativeauth?sslmode=verify-full"
  DECLARATIVEAUTH_SMTP_PASSWORD: "changeme"
