# Dev-only convenience stack for manual click-through testing (login,
# password reset email, LDAP search) against a production-built image. For
# the Go toolchain dev environment used to build/test the code itself, see
# docker-compose.dev.yml instead.
services:
  declarativeauth:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    command: ["serve", "-config", "/etc/declarativeauth/config/declarativeauth.yaml"]
    ports:
      - "1389:389"
      - "8080:8080"
      - "9090:9090"
    environment:
      - DB_PASSWORD=declarativeauth
      - DECLARATIVEAUTH_PASSWORD_PEPPER=dev-only-pepper-do-not-use-in-prod
    volumes:
      - ./configs/example:/etc/declarativeauth/identity:ro
      - ./deploy/compose/declarativeauth.yaml:/etc/declarativeauth/config/declarativeauth.yaml:ro
    depends_on:
      - postgres
      - mailcatcher

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=declarativeauth
      - POSTGRES_PASSWORD=declarativeauth
      - POSTGRES_DB=declarativeauth
    ports:
      - "5432:5432"

  mailcatcher:
    image: sj26/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"
